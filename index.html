<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A cheerful hello from Mrs. King." />
    <title>Hello, I am Mrs. King!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="hello-card" aria-labelledby="greeting">
      <div class="doodle doodle-star" aria-hidden="true">✦</div>
      <div class="doodle doodle-flower" aria-hidden="true">✿</div>
      <div class="doodle doodle-heart" aria-hidden="true">♥</div>

      <p class="eyebrow">a little hello from</p>
      <h1 id="greeting" aria-label="Hello, I am Mrs. King">
        <span class="hello">hello!</span>
        <span class="intro">i am</span>
        <span class="name">mrs. king</span>
      </h1>
      <div class="smile" aria-hidden="true"></div>
    </main>
  </body>
</html>
